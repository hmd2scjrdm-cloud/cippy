<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>订单确认 — Cippy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet"/>

<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"surface-container-low": "#f5f0ee", "outline-variant": "#e0e0e0", "primary-fixed": "#ffd9dd", "on-tertiary": "#ffffff", secondary: "#77555a", "on-background": "#201a1b", "on-secondary": "#ffffff", primary: "#C4928A", outline: "#857374", "surface-container-lowest": "#ffffff", "on-secondary-fixed": "#2d1418", "surface-container-highest": "#e8e0dd", "surface-variant": "#eddfe0", "on-primary-fixed-variant": "#70343e", "surface-tint": "#8d4a55", "surface-container": "#f0ebe8", "secondary-container": "#ffd2d6", "inverse-surface": "#362f2f", "tertiary-container": "#73ae85", "on-surface": "#201a1b", "inverse-on-surface": "#fbeeee", "inverse-primary": "#ffb2bc", "surface-container-high": "#ece6e3", "on-surface-variant": "#524344", "on-tertiary-container": "#004122", "on-tertiary-fixed-variant": "#155130", "primary-fixed-dim": "#ffb2bc", "secondary-fixed": "#ffd9dd", "on-secondary-container": "#7a585c", "on-primary-fixed": "#3a0814", "on-error": "#ffffff", "on-secondary-fixed-variant": "#5e3e42", "surface-bright": "#faf7f5", "on-primary-container": "#5e252f", "primary-container": "#da8b96", error: "#ba1a1a", "tertiary-fixed": "#b3f1c3", "error-container": "#ffdad6", "on-error-container": "#93000a", "surface-dim": "#e4d7d7", "secondary-fixed-dim": "#e7bcc0", "on-tertiary-fixed": "#00210f", background: "#faf7f5", tertiary: "#306946", "on-primary": "#2d1418", surface: "#faf7f5", "tertiary-fixed-dim": "#98d4a9"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {"margin-desktop": "80px", xs: "4px", md: "24px", "margin-mobile": "20px", lg: "48px", xl: "64px", sm: "12px", base: "8px", gutter: "16px"}, fontFamily: {"label-md": ["Poppins", "Noto Serif SC", "serif"], "headline-lg": ["Playfair Display", "Noto Serif SC", "serif"], "body-sm": ["Poppins", "Noto Serif SC", "serif"], "headline-md": ["Playfair Display", "Noto Serif SC", "serif"], "body-lg": ["Poppins", "Noto Serif SC", "serif"], "body-md": ["Poppins", "Noto Serif SC", "serif"], "display-lg": ["Playfair Display", "Noto Serif SC", "serif"], "label-sm": ["Poppins", "Noto Serif SC", "serif"], "headline-lg-mobile": ["Playfair Display", "Noto Serif SC", "serif"], headline: ["Playfair Display", "Noto Serif SC", "serif"], display: ["Playfair Display", "Noto Serif SC", "serif"], body: ["Poppins", "Noto Serif SC", "serif"], label: ["Poppins", "Noto Serif SC", "serif"]}, fontSize: {"label-md": ["14px", {lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600"}], "headline-lg": ["32px", {lineHeight: "40px", fontWeight: "700"}], "body-sm": ["14px", {lineHeight: "20px", fontWeight: "400"}], "headline-md": ["24px", {lineHeight: "32px", fontWeight: "600"}], "body-lg": ["18px", {lineHeight: "28px", fontWeight: "400"}], "body-md": ["16px", {lineHeight: "24px", fontWeight: "400"}], "display-lg": ["48px", {lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700"}], "label-sm": ["12px", {lineHeight: "14px", fontWeight: "500"}], "headline-lg-mobile": ["28px", {lineHeight: "36px", fontWeight: "700"}]}}}};
</script>
<style>
  body { background-color: #faf7f5; color: #201a1b; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="font-body-md min-h-screen pb-16">

<!-- Nav -->
<nav class="sticky top-0 z-20 border-b border-outline-variant" style="background:#faf7f5">
  <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="index.html">
      <img src="assets/cippy-logo.png" alt="cippy" class="h-16 w-auto">
    </a>
    <a href="products.html" class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">继续购物</a>
  </div>
</nav>

<main class="max-w-2xl mx-auto px-6 py-12">

  <!-- Success -->
  <div class="text-center mb-10">
    <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-6">
      <span class="material-symbols-outlined text-3xl text-on-primary" style="font-variation-settings:'FILL' 1;">check</span>
    </div>
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">订单已确认</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">感谢您的购买！确认邮件已发送至您的邮箱。</p>
  </div>

  <!-- Order card -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl overflow-hidden mb-8">

    <!-- Header -->
    <div class="bg-secondary text-on-secondary px-6 py-5">
      <p class="font-label-sm text-label-sm uppercase tracking-widest text-on-secondary/60 mb-1">Order Confirmation</p>
      <p class="font-headline-md text-headline-md tracking-wider" id="orderIdDisplay">—</p>
    </div>

    <div class="p-6 space-y-6">

      <!-- Customer -->
      <div>
        <p class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant mb-3">寄送至</p>
        <div class="font-body-md text-body-md text-on-surface space-y-1" id="customerInfo"></div>
      </div>

      <div class="border-t border-outline-variant"></div>

      <!-- Items -->
      <div>
        <p class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant mb-3">商品明细</p>
        <div class="space-y-4" id="itemsList"></div>
      </div>

      <div class="border-t border-outline-variant"></div>

      <!-- Totals -->
      <div class="space-y-2">
        <div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
          <span>小计</span><span id="subtotalDisplay">—</span>
        </div>
        <div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
          <span>运费</span><span id="shippingDisplay">—</span>
        </div>
        <div class="border-t border-outline-variant pt-3 flex justify-between font-headline-md text-headline-md text-on-surface">
          <span>合计</span><span id="totalDisplay">—</span>
        </div>
      </div>

    </div>
  </div>

  <!-- CTA -->
  <div class="flex flex-col sm:flex-row gap-3">
    <a href="products.html" class="flex-1 text-center bg-primary text-on-primary py-4 font-label-md text-label-md hover:opacity-80 transition-opacity rounded-none">
      继续购物
    </a>
    <a href="account.html" class="flex-1 text-center border border-outline-variant text-on-surface py-4 font-label-md text-label-md hover:bg-surface-container transition-colors rounded-none">
      查看我的订单
    </a>
  </div>

</main>

<script type="module">
// After Stripe payment, move pending order to last order and clear cart
const params = new URLSearchParams(location.search);
const fmt = new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR' });

// Prefer pending order (just returned from Stripe) over last_order
const pendingRaw = localStorage.getItem('cippy_pending_order');
const lastRaw = localStorage.getItem('cippy_last_order');

const method = params.get('method'); // 'billplz' or null (Stripe)

// Clear cart on successful payment return
if (params.get('session_id') || method === 'billplz') {
  localStorage.removeItem('cippy_cart');
}

// Stripe: confirm payment + award points server-side
if (params.get('session_id')) {
  const orderId = params.get('order');
  import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm').then(({ createClient }) => {
    const sb = createClient('https://ilzeziznxzaxxudzhdmu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsemV6aXpueHpheHh1ZHpoZG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2Njk1ODMsImV4cCI6MjA5NzI0NTU4M30.NrfZ9tuDOHRkkeuotdF838ATIBsEkKa21LCpJ_AdQuI');
    sb.auth.getSession().then(async ({ data: { session } }) => {
      if (!orderId) return;
      try {
        await fetch('/api/confirm-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session?.access_token || ''}`
          },
          body: JSON.stringify({ orderId, sessionId: params.get('session_id') })
        });
      } catch(e) {}
    });
  }).catch(() => {});
}
// Billplz: already confirmed via POST callback — nothing to call here

if (pendingRaw) {
  localStorage.setItem('cippy_last_order', pendingRaw);
  localStorage.removeItem('cippy_pending_order');
}

const orderIdEl = document.getElementById('orderIdDisplay');
if (params.get('order')) orderIdEl.textContent = params.get('order');

const raw = pendingRaw || lastRaw;
if (raw) {
  try {
    const { customer, items, totals } = JSON.parse(raw);

    document.getElementById('customerInfo').innerHTML = `
      <p class="font-semibold">${customer.name || ''}</p>
      <p class="text-on-surface-variant">${customer.email || ''}</p>
      <p class="text-on-surface-variant">${customer.phone || ''}</p>
      <p class="text-on-surface-variant mt-1">${(customer.address || '').replace(/\n/g, '<br>')}</p>
    `;

    document.getElementById('itemsList').innerHTML = (items || []).map(item => {
      const name = item.name_zh || item.name || 'Item';
      const details = [item.variant, item.color, item.size].filter(Boolean).join(' / ');
      const qty = Number(item.qty || 1);
      const price = Number(item.price_myr || 0) * qty;
      const img = item.image_url || '';
      return `
        <div class="flex items-center gap-4">
          ${img
            ? `<img src="${img}" class="w-16 h-20 object-cover rounded-xl bg-surface-container flex-shrink-0">`
            : `<div class="w-16 h-20 bg-surface-container rounded-xl flex-shrink-0"></div>`}
          <div class="flex-1 min-w-0">
            <p class="font-label-md text-label-md text-on-surface leading-tight mb-1">${name}</p>
            ${details ? `<p class="font-label-sm text-label-sm text-on-surface-variant">${details}</p>` : ''}
            <p class="font-label-sm text-label-sm text-on-surface-variant">x ${qty}</p>
          </div>
          <p class="font-label-md text-label-md text-on-surface flex-shrink-0">MYR ${price.toFixed(2)}</p>
        </div>
      `;
    }).join('');

    if (totals) {
      document.getElementById('subtotalDisplay').textContent = fmt.format(totals.subtotal || 0);
      document.getElementById('shippingDisplay').textContent = totals.shipping === 0 ? 'FREE' : fmt.format(totals.shipping || 0);
      document.getElementById('totalDisplay').textContent = fmt.format(totals.total || 0);
    }
  } catch(e) {}
}
</script>
</body>
</html>
