</script>

<body class="font-body-md pb-24">

<!-- Loading -->

<!-- Content -->
<main id="orderContent" class="hidden max-w-2xl mx-auto px-6 py-6 space-y-4">

  <!-- Status banner -->
  <div id="statusBanner" class="rounded-2xl px-5 py-4 flex items-center gap-3">

  <!-- Progress tracker -->

    <div class="relative flex items-start justify-between" id="progressTracker">
      <!-- connecting line -->
      <div class="absolute top-4 left-0 right-0 h-0.5 bg-outline-variant mx-8" style="z-index:0"></div>
      <div id="progressLine" class="absolute top-4 left-0 h-0.5 bg-primary mx-8 transition-all duration-500" style="z-index:1;width:0%"></div>
    </div>
  </div>

  <!-- Items -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl overflow-hidden">
    <div class="px-5 py-4 border-b border-outline-variant">
      <p class="font-label-md text-label-md text-on-surface">商品明细</p>
    </div>
    <div id="itemsList" class="divide-y divide-outline-variant px-5"></div>
    <div class="px-5 py-4 border-t border-outline-variant space-y-2">
      <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
        <span>小计</span><span id="subtotal">—</span>
      </div>
      <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
        <span>运费</span><span id="shipping">—</span>
      </div>
      <div class="flex justify-between font-label-md text-label-md text-on-surface pt-2 border-t border-outline-variant">
        <span>合计</span><span id="total">—</span>
      </div>
    </div>
  </div>

  <!-- Recipient -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl overflow-hidden">
    <div class="px-5 py-4 border-b border-outline-variant">
      <p class="font-label-md text-label-md text-on-surface">Receiver Details</p>
    </div>
    <div class="px-5 py-4 space-y-2 font-body-sm text-body-sm">
      <div class="flex gap-3">
        <span class="material-symbols-outlined text-on-surface-variant text-[18px] mt-0.5">person</span>
        <p id="recipientName" class="text-on-surface font-medium"></p>
      </div>
      <div class="flex gap-3">
        <span class="material-symbols-outlined text-on-surface-variant text-[18px] mt-0.5">phone</span>
        <p id="recipientPhone" class="text-on-surface-variant"></p>
      </div>
      <div class="flex gap-3">
        <span class="material-symbols-outlined text-on-surface-variant text-[18px] mt-0.5">location_on</span>
        <p id="recipientAddress" class="text-on-surface-variant leading-relaxed"></p>
      </div>
      <div class="flex gap-3">
        <span class="material-symbols-outlined text-on-surface-variant text-[18px] mt-0.5">mail</span>
        <p id="recipientEmail" class="text-on-surface-variant"></p>
      </div>
    </div>
  </div>

  <!-- Order info -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl px-5 py-4 space-y-2 font-body-sm text-body-sm">
    <div class="flex justify-between">
      <span class="text-on-surface-variant">下单时间</span>
      <span id="orderDate" class="text-on-surface"></span>
    </div>
    <div class="flex justify-between">
      <span class="text-on-surface-variant">付款方式</span>
      <span class="text-on-surface">Stripe 信用卡</span>
    </div>

  <!-- Help -->
  <p class="text-center font-label-sm text-label-sm text-on-surface-variant pt-2">
    如有问题请联系 <a href="https://wa.me/601119058658" class="text-primary underline">WhatsApp 客服</a>
  </p>

<!-- Mobile Bottom Nav -->
<div class="md:hidden fixed bottom-0 left-0 right-0 h-20 bg-surface/80 backdrop-blur-xl flex items-center justify-around px-gutter z-50 rounded-t-[32px] shadow-[0_-10px_30px_rgba(0,0,0,0.05)] border-t border-white/20">
  <a href="index.html" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined">home</span>

  <a href="products.html" class="flex flex-col items-center gap-1 text-on-surface-variant">

    <span class="text-[10px] font-bold uppercase tracking-wider">Explore</span>
  </a>
  <a href="cart.html" class="w-14 h-14 bg-primary rounded-full -mt-10 flex items-center justify-center text-on-primary shadow-lg shadow-primary/40 active:scale-90 transition-transform">
    <span class="material-symbols-outlined text-3xl">shopping_bag</span>
  </a>
  <a href="wishlist.html" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined">favorite</span>
    <span class="text-[10px] font-bold uppercase tracking-wider">Saves</span>
  </a>
  <a href="account.html" class="flex flex-col items-center gap-1 text-primary">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">person</span>
    <span class="text-[10px] font-bold uppercase tracking-wider">Me</span>
  </a>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const sb = createClient('https://ilzeziznxzaxxudzhdmu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsemV6aXpueHpheHh1ZHpoZG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2Njk1ODMsImV4cCI6MjA5NzI0NTU4M30.NrfZ9tuDOHRkkeuotdF838ATIBsEkKa21LCpJ_AdQuI');

const fmt = new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR' });

const statusConfig = {
  pending:    { label: '待付款',  icon: 'schedule',        cls: 'bg-error-container text-on-error-container' },
  paid:       { label: '已付款',  icon: 'check_circle',    cls: 'bg-secondary-container text-secondary' },
  processing: { label: '处理中',  icon: 'inventory_2',     cls: 'bg-primary-fixed text-on-surface' },
  shipped:    { label: '已发货',  icon: 'local_shipping',  cls: 'bg-tertiary-container text-on-tertiary-container' },
  delivered:  { label: '已送达',  icon: 'done_all',        cls: 'bg-tertiary-container text-on-tertiary-container' },
  cancelled:  { label: '已取消',  icon: 'cancel',          cls: 'bg-surface-container-high text-on-surface-variant' },
};

const id = new URLSearchParams(location.search).get('id');
if (!id) { showError(); } else { loadOrder(id); }

async function loadOrder(id) {
  const { data: order, error } = await sb.from('orders').select('*').eq('id', id).single();
  if (error || !order) { showError(); return; }

  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('orderContent').classList.remove('hidden');

  // Status banner
  const st = statusConfig[order.status] || { label: order.status, icon: 'info', cls: 'bg-surface-container text-on-surface' };
  const banner = document.getElementById('statusBanner');
  banner.className = `rounded-2xl px-5 py-4 flex items-center gap-3 ${st.cls}`;
  document.getElementById('statusIcon').textContent = st.icon;
  document.getElementById('statusIcon').style.fontVariationSettings = "'FILL' 1";
  document.getElementById('statusLabel').textContent = st.label;
  document.getElementById('orderId').textContent = order.order_id;

  // Progress tracker
  const steps = [
    { key: 'pending',    label: '待付款', icon: 'schedule' },
    { key: 'paid',       label: '已付款', icon: 'payments' },
    { key: 'processing', label: '处理中', icon: 'inventory_2' },
    { key: 'shipped',    label: '已发货', icon: 'local_shipping' },
    { key: 'delivered',  label: '已送达', icon: 'done_all' },
  ];
  const cancelled = order.status === 'cancelled';
  const currentIdx = cancelled ? -1 : steps.findIndex(s => s.key === order.status);
  const tracker = document.getElementById('progressTracker');
  const lineEl = document.getElementById('progressLine');

  // Build step nodes
  const nodes = steps.map((step, i) => {
    const done = !cancelled && i <= currentIdx;
    const active = !cancelled && i === currentIdx;
    const circleCls = done
      ? 'bg-primary text-on-primary border-primary'
      : 'bg-surface-container-lowest text-on-surface-variant border-outline-variant';
    return `
      <div class="flex flex-col items-center gap-2 flex-1 relative" style="z-index:2">
        <div class="w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all ${circleCls} ${active ? 'ring-2 ring-primary ring-offset-2' : ''}">
          <span class="material-symbols-outlined text-[15px]" style="font-variation-settings:'FILL' ${done ? 1 : 0}">${step.icon}</span>
        </div>
        <p class="font-label-sm text-[10px] text-center leading-tight ${done ? 'text-primary font-bold' : 'text-on-surface-variant'}">${step.label}</p>
      </div>`;
  }).join('');

  tracker.innerHTML = `
    <div class="absolute top-4 left-8 right-8 h-0.5 bg-outline-variant" style="z-index:0"></div>
    <div id="progressLine" class="absolute top-4 left-8 h-0.5 bg-primary transition-all duration-700" style="z-index:1;width:${cancelled || currentIdx <= 0 ? 0 : Math.min((currentIdx / (steps.length - 1)) * 100, 100)}%;max-width:calc(100% - 4rem)"></div>
    ${nodes}
  `;

  if (cancelled) {
    tracker.insertAdjacentHTML('beforeend', `<p class="w-full text-center font-label-sm text-label-sm text-on-surface-variant mt-3">订单已取消</p>`);
  }

  // Items
  const items = order.items || [];
  document.getElementById('itemsList').innerHTML = items.map(item => {
    const name = item.name_zh || item.name || 'Item';
    const details = [item.size, item.color, item.variant].filter(Boolean).join(' · ');
    const qty = Number(item.qty || 1);
    const price = Number(item.price_myr || 0) * qty;
    return `
      <div class="flex items-center gap-4 py-4">
        ${item.image_url
          ? `<img src="${item.image_url}" class="w-16 h-20 object-cover rounded-xl flex-shrink-0">`
          : `<div class="w-16 h-20 bg-surface-container rounded-xl flex-shrink-0"></div>`}
        <div class="flex-1 min-w-0">
          <p class="font-label-md text-label-md text-on-surface leading-tight mb-1">${name}</p>
          ${details ? `<p class="font-label-sm text-label-sm text-on-surface-variant mb-1">${details}</p>` : ''}
          <p class="font-label-sm text-label-sm text-on-surface-variant">数量：${qty}</p>
        </div>
        <p class="font-label-md text-label-md text-on-surface flex-shrink-0">MYR ${price.toFixed(2)}</p>
      </div>`;
  }).join('');

  // Totals
  const totals = order.totals || {};
  document.getElementById('subtotal').textContent = fmt.format(totals.subtotal || 0);
  document.getElementById('shipping').textContent = totals.shipping === 0 ? 'FREE' : fmt.format(totals.shipping || 0);
  document.getElementById('total').textContent = fmt.format(totals.total || 0);

  // Recipient
  const c = order.customer || {};
  document.getElementById('recipientName').textContent = c.name || '—';
  document.getElementById('recipientPhone').textContent = c.phone || '—';
  document.getElementById('recipientEmail').textContent = c.email || '—';
  document.getElementById('recipientAddress').innerHTML = (c.address || '—').replace(/\n/g, '<br>');

  // Date
  document.getElementById('orderDate').textContent = new Date(order.created_at).toLocaleString('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}

function showError() {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('errorState').classList.remove('hidden');
}
</script>
</body>
</html>
