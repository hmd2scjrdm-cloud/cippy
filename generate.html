<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>cippy | AI 产品图生成</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @font-face {
    font-family: "JF Open Huninn";
    src: url("assets/jf-openhuninn.ttf") format("truetype");
    font-display: swap;
  }
  body { font-family: "JF Open Huninn", sans-serif; background: #faf7f5; }
  .drop-zone { border: 2px dashed #C4928A; transition: background 0.2s; }
  .drop-zone.drag-over { background: #fdf0ed; }
</style>
</head>
<body class="min-h-screen p-8">

<!-- Login screen -->
<div id="loginScreen" class="hidden max-w-sm mx-auto mt-32 text-center">
  <img src="assets/cippy-logo.png" alt="cippy" class="h-20 mx-auto mb-8"/>
  <h1 class="text-xl font-bold text-stone-700 mb-2">内部工具</h1>
  <p class="text-stone-400 text-sm mb-8">仅限授权账号访问</p>
  <button id="loginBtn"
    class="w-full py-3 bg-[#C4928A] text-white font-bold rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-3">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 19 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.5 35.6 26.9 36 24 36c-5.2 0-9.6-2.9-11.2-7.1l-6.5 5C9.9 39.8 16.5 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C41.2 35.4 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
    用 Google 账号登录
  </button>
</div>

<!-- Unauthorized screen -->
<div id="unauthorizedScreen" class="hidden max-w-sm mx-auto mt-32 text-center">
  <div class="text-5xl mb-4">🔒</div>
  <h1 class="text-xl font-bold text-stone-700 mb-2">无访问权限</h1>
  <p class="text-stone-400 text-sm mb-6">此账号没有访问权限</p>
  <button id="logoutBtn2" class="text-sm text-[#C4928A] underline">换个账号登录</button>
</div>

<!-- Main app -->
<div id="app" class="hidden max-w-2xl mx-auto">
  <div class="flex justify-between items-center mb-8">
    <a href="index.html" class="text-sm text-stone-400 hover:text-stone-600">← 返回网站</a>
    <button id="logoutBtn" class="text-sm text-stone-400 hover:text-stone-600">退出登录</button>
  </div>

  <h1 class="text-3xl font-bold text-stone-800 mb-2">AI 产品展示图生成</h1>
  <p class="text-stone-500 mb-8">上传单品图，自动生成高质量展示图</p>

  <!-- Upload -->
  <div class="drop-zone rounded-lg p-12 text-center cursor-pointer mb-6" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" class="hidden"/>
    <div id="uploadPrompt">
      <div class="text-4xl mb-3">📸</div>
      <p class="text-stone-600 font-medium">点击上传或拖放产品图</p>
      <p class="text-stone-400 text-sm mt-1">JPG / PNG，建议白底或纯色背景</p>
    </div>
    <img id="preview" class="hidden max-h-64 mx-auto rounded-lg object-contain"/>
  </div>

  <!-- Type selector -->
  <div class="grid grid-cols-2 gap-3 mb-6">
    <label class="type-btn cursor-pointer">
      <input type="radio" name="type" value="background" checked class="hidden"/>
      <div class="border-2 border-[#C4928A] bg-[#C4928A] text-white rounded-lg p-3 text-center text-sm font-medium type-label">
        🏙 换背景/场景
      </div>
    </label>
    <label class="type-btn cursor-pointer">
      <input type="radio" name="type" value="tryOn" class="hidden"/>
      <div class="border-2 border-stone-200 rounded-lg p-3 text-center text-sm font-medium text-stone-600 type-label">
        👗 模特上身效果
      </div>
    </label>
    <label class="type-btn cursor-pointer">
      <input type="radio" name="type" value="flatlay" class="hidden"/>
      <div class="border-2 border-stone-200 rounded-lg p-3 text-center text-sm font-medium text-stone-600 type-label">
        🫧 平铺摆拍
      </div>
    </label>
    <label class="type-btn cursor-pointer">
      <input type="radio" name="type" value="detail" class="hidden"/>
      <div class="border-2 border-stone-200 rounded-lg p-3 text-center text-sm font-medium text-stone-600 type-label">
        🔍 细节特写
      </div>
    </label>
  </div>

  <!-- Generate button -->
  <button id="generateBtn" disabled
    class="w-full py-4 bg-[#C4928A] text-white font-bold rounded-lg disabled:opacity-40 disabled:cursor-not-allowed hover:opacity-90 transition-opacity text-lg">
    生成展示图
  </button>

  <!-- Status -->
  <div id="status" class="hidden mt-6 text-center text-stone-500 text-sm">
    <div class="inline-flex items-center gap-2">
      <svg class="animate-spin h-4 w-4 text-[#C4928A]" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
      <span id="statusText">Claude 正在分析产品…</span>
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="hidden mt-8">
    <h2 class="font-bold text-stone-700 mb-3">生成结果</h2>
    <img id="resultImg" class="w-full rounded-xl shadow-lg"/>
    <div class="mt-4 flex gap-3">
      <a id="downloadBtn" download="cippy-showcase.png"
        class="flex-1 py-3 border-2 border-[#C4928A] text-[#C4928A] rounded-lg text-center font-medium hover:bg-[#fdf0ed] transition-colors">
        下载图片
      </a>
      <button id="regenerateBtn"
        class="flex-1 py-3 bg-[#C4928A] text-white rounded-lg font-medium hover:opacity-90 transition-opacity">
        重新生成
      </button>
    </div>
    <details class="mt-4">
      <summary class="text-xs text-stone-400 cursor-pointer">查看 AI 分析描述</summary>
      <p id="productDesc" class="text-xs text-stone-500 mt-2 bg-stone-100 p-3 rounded-lg leading-relaxed"></p>
    </details>
  </div>

  <!-- Error -->
  <div id="error" class="hidden mt-6 bg-red-50 border border-red-200 rounded-lg p-4 text-red-600 text-sm"></div>
</div>

<script>
const SUPABASE_URL = 'https://ilzeziznxzaxxudzhdmu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsemV6aXpueHpheHh1ZHpoZG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2Njk1ODMsImV4cCI6MjA5NzI0NTU4M30.NrfZ9tuDOHRkkeuotdF838ATIBsEkKa21LCpJ_AdQuI';
const ALLOWED_EMAILS = ['cippy.kl@gmail.com'];

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Auth state
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  handleSession(session);

  sb.auth.onAuthStateChange((_event, session) => handleSession(session));
}

function handleSession(session) {
  const loginScreen = document.getElementById('loginScreen');
  const unauthorizedScreen = document.getElementById('unauthorizedScreen');
  const app = document.getElementById('app');

  if (!session) {
    loginScreen.classList.remove('hidden');
    unauthorizedScreen.classList.add('hidden');
    app.classList.add('hidden');
    return;
  }

  const email = session.user.email;
  if (!ALLOWED_EMAILS.includes(email)) {
    loginScreen.classList.add('hidden');
    unauthorizedScreen.classList.remove('hidden');
    app.classList.add('hidden');
    return;
  }

  loginScreen.classList.add('hidden');
  unauthorizedScreen.classList.add('hidden');
  app.classList.remove('hidden');
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
});
document.getElementById('logoutBtn2').addEventListener('click', async () => {
  await sb.auth.signOut();
});

init();

// Upload
let imageBase64 = null;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const uploadPrompt = document.getElementById('uploadPrompt');
const generateBtn = document.getElementById('generateBtn');
const status = document.getElementById('status');
const statusText = document.getElementById('statusText');
const result = document.getElementById('result');
const resultImg = document.getElementById('resultImg');
const downloadBtn = document.getElementById('downloadBtn');
const errorDiv = document.getElementById('error');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const MAX = 800;
    let w = img.width, h = img.height;
    if (w > MAX || h > MAX) {
      if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
      else { w = Math.round(w * MAX / h); h = MAX; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    imageBase64 = canvas.toDataURL('image/jpeg', 0.75);
    preview.src = imageBase64;
    preview.classList.remove('hidden');
    uploadPrompt.classList.add('hidden');
    generateBtn.disabled = false;
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

document.querySelectorAll('input[name="type"]').forEach(radio => {
  radio.addEventListener('change', () => {
    document.querySelectorAll('.type-label').forEach(el => {
      el.className = 'border-2 border-stone-200 rounded-lg p-3 text-center text-sm font-medium text-stone-600 type-label';
    });
    radio.nextElementSibling.className = 'border-2 border-[#C4928A] bg-[#C4928A] text-white rounded-lg p-3 text-center text-sm font-medium type-label';
  });
});

generateBtn.addEventListener('click', generate);
document.getElementById('regenerateBtn').addEventListener('click', generate);

async function generate() {
  if (!imageBase64) return;
  const type = document.querySelector('input[name="type"]:checked').value;

  errorDiv.classList.add('hidden');
  result.classList.add('hidden');
  status.classList.remove('hidden');
  generateBtn.disabled = true;

  const typeLabels = { background: '构建场景', tryOn: '生成模特效果', flatlay: '排版平铺图', detail: '放大细节' };
  statusText.textContent = `Claude 正在分析产品… 然后 OpenAI 将${typeLabels[type]}`;

  try {
    const res = await fetch('/api/generate-showcase', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64, type }),
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(res.status === 413 ? '图片太大，请用更小的图片' : `服务器错误 ${res.status}`); }
    if (!res.ok) throw new Error(data.error || 'Unknown error');

    const imgSrc = data.image.url || `data:image/png;base64,${data.image.base64}`;
    resultImg.src = imgSrc;
    downloadBtn.href = imgSrc;
    document.getElementById('productDesc').textContent = data.productDescription;

    status.classList.add('hidden');
    result.classList.remove('hidden');
  } catch (err) {
    status.classList.add('hidden');
    errorDiv.textContent = `生成失败：${err.message}`;
    errorDiv.classList.remove('hidden');
  } finally {
    generateBtn.disabled = false;
  }
}
</script>
</body>
</html>
