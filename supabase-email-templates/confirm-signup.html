<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#faf7f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#faf7f5;padding:40px 16px;">
<tr><td align="center"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">

  <tr><td style="text-align:center;padding-bottom:28px;">
    <p style="margin:0;font-size:24px;font-weight:700;letter-spacing:0.2em;color:#201a1b;">CIPPY</p>
    <p style="margin:4px 0 0;font-size:11px;letter-spacing:0.15em;color:#B96A73;text-transform:uppercase;">Daily &amp; Lovely</p>
  </td></tr>

  <tr><td style="background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">

    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#77555a;">
      <tr><td style="padding:28px;text-align:center;">
        <p style="margin:0 0 6px;font-size:11px;color:#e7bcc0;letter-spacing:0.12em;text-transform:uppercase;">Welcome to Cippy</p>
        <p style="margin:0;font-size:20px;font-weight:700;color:#fff;">🌸 欢迎加入 Cippy 会员</p>
      </td></tr>
    </table>

    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr><td style="padding:32px 28px;text-align:center;">
        <p style="margin:0 0 8px;font-size:15px;font-weight:600;color:#201a1b;">亲爱的仙女，您好！</p>
        <p style="margin:0 0 24px;font-size:13px;color:#524344;line-height:1.7;">
          感谢您注册成为 Cippy 会员。请点击下方按钮完成邮箱验证，即可解锁积分、专属折扣与新品优先购买权。
        </p>

        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;background:#B96A73;color:#ffffff;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:0.05em;padding:14px 36px;border-radius:12px;">
          确认邮箱 · Verify Email
        </a>

        <p style="margin:24px 0 0;font-size:11px;color:#a89797;line-height:1.6;">
          如果按钮无法点击，请复制以下链接到浏览器打开：<br>
          <span style="color:#B96A73;word-break:break-all;">{{ .ConfirmationURL }}</span>
        </p>
      </td></tr>

      <tr><td style="background:#faf7f5;padding:18px 28px;border-top:1px solid #f0ebe8;text-align:center;">
        <p style="margin:0 0 6px;font-size:12px;color:#524344;">如非本人操作，请忽略此邮件</p>
        <p style="margin:0;font-size:11px;color:#857374;letter-spacing:0.08em;">&copy; 2026 CIPPY · All rights reserved</p>
      </td></tr>
    </table>

  </td></tr>
</table></td></tr>
</table>
</body>
</html>
