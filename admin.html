<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>cippy | 管理后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @font-face { font-family: "JF Open Huninn"; src: url("assets/jf-openhuninn.ttf") format("truetype"); font-display: swap; }
  body { font-family: "JF Open Huninn", sans-serif; background: #faf7f5; }
</style>
</head>
<body class="min-h-screen">

<!-- Login screen -->
<div id="loginScreen" class="hidden max-w-sm mx-auto mt-32 text-center px-8">
  <img src="assets/cippy-logo.png" alt="cippy" class="h-16 mx-auto mb-8"/>
  <p class="text-stone-400 text-sm mb-6">管理员登录</p>
  <button id="loginBtn" class="w-full py-3 bg-[#C4928A] text-white font-bold rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-3">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 19 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.5 35.6 26.9 36 24 36c-5.2 0-9.6-2.9-11.2-7.1l-6.5 5C9.9 39.8 16.5 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C41.2 35.4 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
    Google 登录
  </button>
</div>

<!-- Main -->
<div id="app" class="hidden">
  <!-- Nav -->
  <nav class="bg-white border-b border-stone-200 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-6">
      <img src="assets/cippy-logo.png" alt="cippy" class="h-10"/>
      <span class="text-stone-300">|</span>
      <a href="admin.html" class="text-sm font-bold text-[#C4928A]">库存总览</a>
      <a href="admin-products.html" class="text-sm text-stone-500 hover:text-stone-800">商品管理</a>
      <a href="generate.html" class="text-sm text-stone-500 hover:text-stone-800">AI 图生成</a>
    </div>
    <div class="flex items-center gap-4">
      <span id="userEmail" class="text-xs text-stone-400"></span>
      <button id="logoutBtn" class="text-xs text-stone-400 hover:text-stone-600">退出</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-8">
    <h1 class="text-2xl font-bold text-stone-800 mb-6">库存总览</h1>

    <!-- Summary cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl p-5 border border-stone-100 shadow-sm">
        <p class="text-xs text-stone-400 mb-1">商品总数</p>
        <p id="totalProducts" class="text-3xl font-bold text-stone-800">—</p>
      </div>
      <div class="bg-white rounded-xl p-5 border border-stone-100 shadow-sm">
        <p class="text-xs text-stone-400 mb-1">库存总值（售价）</p>
        <p id="totalValue" class="text-3xl font-bold text-stone-800">—</p>
      </div>
      <div class="bg-white rounded-xl p-5 border border-stone-100 shadow-sm">
        <p class="text-xs text-stone-400 mb-1">库存总成本</p>
        <p id="totalCost" class="text-3xl font-bold text-stone-800">—</p>
      </div>
      <div class="bg-white rounded-xl p-5 border border-stone-100 shadow-sm">
        <p class="text-xs text-stone-400 mb-1">平均毛利率</p>
        <p id="avgMargin" class="text-3xl font-bold text-[#C4928A]">—</p>
      </div>
    </div>

    <!-- Low stock alert -->
    <div id="lowStockAlert" class="hidden mb-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
      <p class="text-sm font-bold text-amber-700 mb-1">⚠️ 低库存商品</p>
      <p id="lowStockList" class="text-sm text-amber-600"></p>
    </div>

    <!-- Products table -->
    <div class="bg-white rounded-xl border border-stone-100 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-stone-100 flex justify-between items-center">
        <h2 class="font-bold text-stone-700">商品明细</h2>
        <a href="admin-products.html" class="text-sm text-[#C4928A] hover:underline">+ 添加商品</a>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-stone-50 text-left text-xs text-stone-400 uppercase tracking-wider">
              <th class="px-6 py-3">商品</th>
              <th class="px-4 py-3">分类</th>
              <th class="px-4 py-3 text-right">售价</th>
              <th class="px-4 py-3 text-right">成本</th>
              <th class="px-4 py-3 text-right">毛利</th>
              <th class="px-4 py-3 text-right">毛利率</th>
              <th class="px-4 py-3 text-right">库存</th>
              <th class="px-4 py-3 text-right">库存价值</th>
            </tr>
          </thead>
          <tbody id="productTable" class="divide-y divide-stone-100">
            <tr><td colspan="8" class="px-6 py-12 text-center text-stone-400">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ilzeziznxzaxxudzhdmu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsemV6aXpueHpheHh1ZHpoZG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2Njk1ODMsImV4cCI6MjA5NzI0NTU4M30.NrfZ9tuDOHRkkeuotdF838ATIBsEkKa21LCpJ_AdQuI';
const ALLOWED_EMAILS = ['cippy.kl@gmail.com'];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  handleSession(session);
  sb.auth.onAuthStateChange((_, session) => handleSession(session));
}

function handleSession(session) {
  if (!session || !ALLOWED_EMAILS.includes(session.user.email)) {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userEmail').textContent = session.user.email;
  loadProducts();
}

document.getElementById('loginBtn').addEventListener('click', () =>
  sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }));
document.getElementById('logoutBtn').addEventListener('click', () => sb.auth.signOut());

async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }

  // Summary
  const count = data.length;
  const totalValue = data.reduce((s, p) => s + p.price * p.stock, 0);
  const totalCost = data.reduce((s, p) => s + p.cost * p.stock, 0);
  const margins = data.filter(p => p.price > 0).map(p => (p.price - p.cost) / p.price * 100);
  const avgMargin = margins.length ? margins.reduce((a, b) => a + b, 0) / margins.length : 0;

  document.getElementById('totalProducts').textContent = count;
  document.getElementById('totalValue').textContent = 'RM ' + totalValue.toFixed(2);
  document.getElementById('totalCost').textContent = 'RM ' + totalCost.toFixed(2);
  document.getElementById('avgMargin').textContent = avgMargin.toFixed(1) + '%';

  // Low stock
  const lowStock = data.filter(p => p.stock <= 3);
  if (lowStock.length) {
    document.getElementById('lowStockAlert').classList.remove('hidden');
    document.getElementById('lowStockList').textContent = lowStock.map(p => `${p.name}（剩 ${p.stock} 件）`).join('、');
  }

  // Table
  const tbody = document.getElementById('productTable');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-12 text-center text-stone-400">暂无商品，<a href="admin-products.html" class="text-[#C4928A] underline">去添加</a></td></tr>';
    return;
  }

  tbody.innerHTML = data.map(p => {
    const gross = p.price - p.cost;
    const margin = p.price > 0 ? (gross / p.price * 100) : 0;
    const marginColor = margin >= 50 ? 'text-green-600' : margin >= 30 ? 'text-amber-600' : 'text-red-500';
    const stockColor = p.stock <= 3 ? 'text-red-500 font-bold' : p.stock <= 10 ? 'text-amber-600' : 'text-stone-700';
    return `
      <tr class="hover:bg-stone-50 transition-colors">
        <td class="px-6 py-4">
          <div class="flex items-center gap-3">
            ${p.image_url ? `<img src="${p.image_url}" class="w-10 h-10 rounded-lg object-cover bg-stone-100"/>` : '<div class="w-10 h-10 rounded-lg bg-stone-100"></div>'}
            <div>
              <p class="font-medium text-stone-800">${p.name}</p>
              ${p.name_zh ? `<p class="text-xs text-stone-400">${p.name_zh}</p>` : ''}
            </div>
          </div>
        </td>
        <td class="px-4 py-4 text-stone-500">${p.category || '—'}</td>
        <td class="px-4 py-4 text-right text-stone-700">RM ${Number(p.price).toFixed(2)}</td>
        <td class="px-4 py-4 text-right text-stone-500">RM ${Number(p.cost).toFixed(2)}</td>
        <td class="px-4 py-4 text-right font-medium text-stone-700">RM ${gross.toFixed(2)}</td>
        <td class="px-4 py-4 text-right font-bold ${marginColor}">${margin.toFixed(1)}%</td>
        <td class="px-4 py-4 text-right ${stockColor}">${p.stock}</td>
        <td class="px-4 py-4 text-right text-stone-500">RM ${(p.price * p.stock).toFixed(2)}</td>
      </tr>`;
  }).join('');
}

init();
</script>
</body>
</html>
