<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>cippy | 商品管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @font-face { font-family: "JF Open Huninn"; src: url("assets/jf-openhuninn.ttf") format("truetype"); font-display: swap; }
  body { font-family: "JF Open Huninn", sans-serif; background: #faf7f5; }
  .modal-bg { background: rgba(0,0,0,0.4); }
</style>
</head>
<body class="min-h-screen">

<!-- Login -->
<div id="loginScreen" class="hidden max-w-sm mx-auto mt-32 text-center p-8">
  <img src="assets/cippy-logo.png" alt="cippy" class="h-16 mx-auto mb-6"/>
  <p class="text-stone-400 text-sm mb-6">管理员登录</p>
  <button id="loginBtn" class="w-full py-3 bg-[#C4928A] text-white font-bold rounded-lg hover:opacity-90 flex items-center justify-center gap-3">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 19 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.5 35.6 26.9 36 24 36c-5.2 0-9.6-2.9-11.2-7.1l-6.5 5C9.9 39.8 16.5 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C41.2 35.4 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
    Google 登录
  </button>
</div>

<!-- Unauthorized -->
<div id="unauthorizedScreen" class="hidden max-w-sm mx-auto mt-32 text-center p-8">
  <div class="text-5xl mb-4">🔒</div>
  <p class="text-stone-500 mb-4">此账号无权限访问</p>
  <button id="logoutBtn2" class="text-sm text-[#C4928A] underline">换账号</button>
</div>

<!-- App -->
<div id="app" class="hidden">
  <!-- Header -->
  <div class="bg-white border-b border-stone-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <img src="assets/cippy-logo.png" alt="cippy" class="h-8"/>
      <span class="text-stone-400 text-sm">商品管理</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="index.html" class="text-sm text-stone-400 hover:text-stone-600">← 前台</a>
      <button id="addBtn" class="bg-[#C4928A] text-white px-4 py-2 rounded-lg text-sm font-bold hover:opacity-90">+ 添加商品</button>
      <button id="logoutBtn" class="text-sm text-stone-400 hover:text-stone-600">退出</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="px-6 py-4 grid grid-cols-3 gap-4 max-w-5xl mx-auto">
    <div class="bg-white rounded-xl p-4 border border-stone-100">
      <p class="text-xs text-stone-400 mb-1">商品总数</p>
      <p id="statTotal" class="text-2xl font-bold text-stone-800">—</p>
    </div>
    <div class="bg-white rounded-xl p-4 border border-stone-100">
      <p class="text-xs text-stone-400 mb-1">上架中</p>
      <p id="statInStock" class="text-2xl font-bold text-stone-800">—</p>
    </div>
    <div class="bg-white rounded-xl p-4 border border-stone-100">
      <p class="text-xs text-stone-400 mb-1">库存总件数</p>
      <p id="statStock" class="text-2xl font-bold text-stone-800">—</p>
    </div>
  </div>

  <!-- Product Table -->
  <div class="px-6 pb-12 max-w-5xl mx-auto">
    <div class="bg-white rounded-xl border border-stone-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-stone-50 border-b border-stone-100">
            <tr>
              <th class="text-left px-4 py-3 text-stone-500 font-medium">商品</th>
              <th class="text-left px-4 py-3 text-stone-500 font-medium">SKU</th>
              <th class="text-left px-4 py-3 text-stone-500 font-medium">进货价 (RMB)</th>
              <th class="text-left px-4 py-3 text-stone-500 font-medium">总成本 (MYR)</th>
              <th class="text-left px-4 py-3 text-stone-500 font-medium">售价 (MYR)</th>
              <th class="text-left px-4 py-3 text-stone-500 font-medium">利润率</th>
              <th class="text-left px-4 py-3 text-stone-500 font-medium">库存</th>
              <th class="text-left px-4 py-3 text-stone-500 font-medium">状态</th>
              <th class="px-4 py-3"></th>
            </tr>
          </thead>
          <tbody id="productTable">
            <tr><td colspan="9" class="text-center py-12 text-stone-400">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 modal-bg z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="sticky top-0 bg-white border-b border-stone-100 px-6 py-4 flex justify-between items-center">
      <h2 id="modalTitle" class="font-bold text-stone-800">添加商品</h2>
      <button id="closeModal" class="text-stone-400 hover:text-stone-600 text-2xl leading-none">&times;</button>
    </div>

    <form id="productForm" class="px-6 py-6 space-y-5">
      <input type="hidden" id="editId"/>

      <!-- Names -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-stone-500 mb-1 block">中文名称 *</label>
          <input id="fNameZh" type="text" required placeholder="巴厘岛午后｜抹茶绑带裙" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
        </div>
        <div>
          <label class="text-xs text-stone-500 mb-1 block">English Name</label>
          <input id="fName" type="text" placeholder="Bali Afternoon Dress" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
        </div>
      </div>

      <!-- Category + SKU -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-stone-500 mb-1 block">分类</label>
          <select id="fCategory" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]">
            <option value="dress">连衣裙</option>
            <option value="top">上衣</option>
            <option value="bottom">下装</option>
            <option value="outerwear">外套</option>
            <option value="accessories">配饰</option>
            <option value="set">套装</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-stone-500 mb-1 block">SKU 货号</label>
          <input id="fSku" type="text" placeholder="001" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
        </div>
      </div>

      <!-- Cost Section -->
      <div class="bg-amber-50 rounded-xl p-4 space-y-3">
        <p class="text-xs font-bold text-amber-700 uppercase tracking-wide">💰 成本计算（人民币 ÷ 1.65 = 马币）</p>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-xs text-stone-500 mb-1 block">进货价 (RMB ¥)</label>
            <input id="fCostRmb" type="number" step="0.01" placeholder="0.00" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
          </div>
          <div>
            <label class="text-xs text-stone-500 mb-1 block">运费/件 (RMB ¥)</label>
            <input id="fShippingRmb" type="number" step="0.01" placeholder="0.00" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
          </div>
          <div>
            <label class="text-xs text-stone-500 mb-1 block">重量 (kg)</label>
            <input id="fWeight" type="number" step="0.001" placeholder="0.000" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
          </div>
        </div>
        <div class="bg-white rounded-lg p-3 flex items-center justify-between">
          <span class="text-xs text-stone-500">总成本 (MYR)</span>
          <span id="calcCostMyr" class="font-bold text-stone-800">RM 0.00</span>
        </div>
      </div>

      <!-- Selling Price -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-stone-500 mb-1 block">售价 (MYR RM) *</label>
          <input id="fPriceMyr" type="number" step="0.01" required placeholder="0.00" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
          <p class="text-xs text-stone-400 mt-1">预计利润率：<span id="calcMargin" class="font-medium text-green-600">—</span></p>
        </div>
        <div>
          <label class="text-xs text-stone-500 mb-1 block">库存数量</label>
          <input id="fStock" type="number" placeholder="0" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
        </div>
      </div>

      <!-- Image -->
      <div>
        <label class="text-xs text-stone-500 mb-1 block">商品图片</label>
        <div class="flex gap-3 items-start">
          <input id="fImageUrl" type="text" placeholder="图片URL 或 上传后自动填入" class="flex-1 border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
          <label class="cursor-pointer bg-stone-100 hover:bg-stone-200 px-3 py-2 rounded-lg text-sm text-stone-600 transition-colors whitespace-nowrap">
            上传图片
            <input id="fImageFile" type="file" accept="image/*" class="hidden"/>
          </label>
        </div>
        <div id="imagePreviewWrap" class="hidden mt-2">
          <img id="imagePreview" class="h-24 rounded-lg object-cover border border-stone-200"/>
        </div>
        <p id="uploadStatus" class="text-xs text-stone-400 mt-1 hidden">上传中…</p>
      </div>

      <!-- Supplier URL -->
      <div>
        <label class="text-xs text-stone-500 mb-1 block">供应商链接（淘宝/1688）</label>
        <input id="fSupplierUrl" type="url" placeholder="https://item.taobao.com/..." class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
      </div>

      <!-- Description -->
      <div>
        <label class="text-xs text-stone-500 mb-1 block">商品描述</label>
        <textarea id="fDescription" rows="2" placeholder="修身显腰，度假感拉满…" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A] resize-none"></textarea>
      </div>

      <!-- Notes -->
      <div>
        <label class="text-xs text-stone-500 mb-1 block">内部备注</label>
        <input id="fNotes" type="text" placeholder="例：发货慢，提前备货" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#C4928A]"/>
      </div>

      <!-- Toggles -->
      <div class="flex gap-6">
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="fIsNew" type="checkbox" checked class="w-4 h-4 accent-[#C4928A]"/>
          <span class="text-sm text-stone-600">标记为新品</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="fInStock" type="checkbox" checked class="w-4 h-4 accent-[#C4928A]"/>
          <span class="text-sm text-stone-600">上架中</span>
        </label>
      </div>

      <!-- Submit -->
      <div class="flex gap-3 pt-2">
        <button type="button" id="cancelBtn" class="flex-1 py-3 border border-stone-200 rounded-lg text-stone-600 text-sm hover:bg-stone-50">取消</button>
        <button type="submit" id="submitBtn" class="flex-1 py-3 bg-[#C4928A] text-white rounded-lg font-bold text-sm hover:opacity-90">保存商品</button>
      </div>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ilzeziznxzaxxudzhdmu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsemV6aXpueHpheHh1ZHpoZG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2Njk1ODMsImV4cCI6MjA5NzI0NTU4M30.NrfZ9tuDOHRkkeuotdF838ATIBsEkKa21LCpJ_AdQuI';
const ALLOWED_EMAILS = ['cippy.kl@gmail.com'];
const RMB_TO_MYR = 1.65; // MYR = RMB ÷ 1.65

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  handleSession(session);
  sb.auth.onAuthStateChange((_, session) => handleSession(session));
}

function handleSession(session) {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('unauthorizedScreen').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  if (!session) { document.getElementById('loginScreen').classList.remove('hidden'); return; }
  if (!ALLOWED_EMAILS.includes(session.user.email)) { document.getElementById('unauthorizedScreen').classList.remove('hidden'); return; }
  document.getElementById('app').classList.remove('hidden');
  loadProducts();
}

document.getElementById('loginBtn').addEventListener('click', () =>
  sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }));
document.getElementById('logoutBtn').addEventListener('click', () => sb.auth.signOut());
document.getElementById('logoutBtn2').addEventListener('click', () => sb.auth.signOut());

async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }

  document.getElementById('statTotal').textContent = data.length;
  document.getElementById('statInStock').textContent = data.filter(p => p.in_stock).length;
  document.getElementById('statStock').textContent = data.reduce((s, p) => s + (p.stock || 0), 0);

  const tbody = document.getElementById('productTable');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-12 text-stone-400">还没有商品，点击「+ 添加商品」开始</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(p => {
    const costMyr = ((parseFloat(p.cost_rmb) || 0) + (parseFloat(p.shipping_cost_rmb) || 0)) / RMB_TO_MYR;
    const margin = p.price_myr && costMyr ? Math.round((p.price_myr - costMyr) / p.price_myr * 100) : null;
    const marginColor = margin > 40 ? 'text-green-600' : margin > 20 ? 'text-amber-500' : 'text-red-500';
    return `
    <tr class="border-b border-stone-50 hover:bg-stone-50 transition-colors">
      <td class="px-4 py-3">
        <div class="flex items-center gap-3">
          ${p.image_url ? `<img src="${p.image_url}" class="w-10 h-10 rounded-lg object-cover border border-stone-100"/>` : '<div class="w-10 h-10 rounded-lg bg-stone-100 flex items-center justify-center text-stone-300 text-lg">📦</div>'}
          <div>
            <p class="font-medium text-stone-800 text-sm">${p.name_zh || p.name}</p>
            ${p.name && p.name_zh ? `<p class="text-xs text-stone-400">${p.name}</p>` : ''}
          </div>
        </div>
      </td>
      <td class="px-4 py-3 text-xs text-stone-400">${p.sku || '—'}</td>
      <td class="px-4 py-3 text-sm">
        ${p.cost_rmb ? `¥${p.cost_rmb}` : '—'}
        ${p.shipping_cost_rmb ? `<br/><span class="text-xs text-stone-400">+¥${p.shipping_cost_rmb} 运</span>` : ''}
      </td>
      <td class="px-4 py-3 text-sm font-medium text-stone-700">${costMyr > 0 ? `RM ${costMyr.toFixed(2)}` : '—'}</td>
      <td class="px-4 py-3 text-sm font-bold text-[#C4928A]">${p.price_myr ? `RM ${parseFloat(p.price_myr).toFixed(2)}` : '—'}</td>
      <td class="px-4 py-3 text-sm">${margin !== null ? `<span class="font-medium ${marginColor}">${margin}%</span>` : '—'}</td>
      <td class="px-4 py-3 text-sm">${p.stock ?? 0}</td>
      <td class="px-4 py-3">
        <span class="text-xs px-2 py-1 rounded-full ${p.in_stock ? 'bg-green-100 text-green-700' : 'bg-stone-100 text-stone-400'}">${p.in_stock ? '上架' : '下架'}</span>
      </td>
      <td class="px-4 py-3">
        <div class="flex gap-2 whitespace-nowrap">
          <button onclick="editProduct('${p.id}')" class="text-xs text-stone-500 hover:text-stone-800 border border-stone-200 px-2 py-1 rounded">编辑</button>
          <button onclick="deleteProduct('${p.id}')" class="text-xs text-red-400 hover:text-red-600 border border-red-100 px-2 py-1 rounded">删除</button>
          ${p.supplier_url ? `<a href="${p.supplier_url}" target="_blank" class="text-xs text-blue-400 hover:text-blue-600 border border-blue-100 px-2 py-1 rounded">补货↗</a>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function calcCost() {
  const costRmb = parseFloat(document.getElementById('fCostRmb').value) || 0;
  const shippingRmb = parseFloat(document.getElementById('fShippingRmb').value) || 0;
  const totalMyr = (costRmb + shippingRmb) / RMB_TO_MYR;
  document.getElementById('calcCostMyr').textContent = `RM ${totalMyr.toFixed(2)}`;

  const priceMyr = parseFloat(document.getElementById('fPriceMyr').value) || 0;
  if (priceMyr > 0 && totalMyr > 0) {
    const margin = Math.round((priceMyr - totalMyr) / priceMyr * 100);
    const el = document.getElementById('calcMargin');
    el.textContent = `${margin}%`;
    el.className = `font-medium ${margin > 40 ? 'text-green-600' : margin > 20 ? 'text-amber-500' : 'text-red-500'}`;
  } else {
    document.getElementById('calcMargin').textContent = '—';
  }
}

['fCostRmb', 'fShippingRmb', 'fPriceMyr'].forEach(id =>
  document.getElementById(id).addEventListener('input', calcCost));

document.getElementById('fImageFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById('uploadStatus');
  status.classList.remove('hidden');
  status.textContent = '压缩中…';

  // Compress image before upload
  const compressed = await new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  status.textContent = '上传中…';
  const path = `${Date.now()}.jpg`;
  const { error } = await sb.storage.from('product-images').upload(path, compressed, { upsert: true, contentType: 'image/jpeg' });
  if (error) { status.textContent = '上传失败：' + error.message; return; }
  const { data: { publicUrl } } = sb.storage.from('product-images').getPublicUrl(path);
  document.getElementById('fImageUrl').value = publicUrl;
  document.getElementById('imagePreview').src = publicUrl;
  document.getElementById('imagePreviewWrap').classList.remove('hidden');
  status.textContent = '✓ 上传成功';
});

document.getElementById('fImageUrl').addEventListener('input', (e) => {
  if (e.target.value) {
    document.getElementById('imagePreview').src = e.target.value;
    document.getElementById('imagePreviewWrap').classList.remove('hidden');
  } else {
    document.getElementById('imagePreviewWrap').classList.add('hidden');
  }
});

function openModal(title) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('productForm').reset();
  document.getElementById('editId').value = '';
  document.getElementById('calcCostMyr').textContent = 'RM 0.00';
  document.getElementById('calcMargin').textContent = '—';
  document.getElementById('imagePreviewWrap').classList.add('hidden');
  document.getElementById('uploadStatus').classList.add('hidden');
}

document.getElementById('addBtn').addEventListener('click', () => openModal('添加商品'));
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

async function editProduct(id) {
  const { data: p } = await sb.from('products').select('*').eq('id', id).single();
  if (!p) return;
  document.getElementById('editId').value = p.id;
  document.getElementById('fNameZh').value = p.name_zh || '';
  document.getElementById('fName').value = p.name || '';
  document.getElementById('fCategory').value = p.category || 'dress';
  document.getElementById('fSku').value = p.sku || '';
  document.getElementById('fCostRmb').value = p.cost_rmb || '';
  document.getElementById('fShippingRmb').value = p.shipping_cost_rmb || '';
  document.getElementById('fWeight').value = p.weight_kg || '';
  document.getElementById('fPriceMyr').value = p.price_myr || '';
  document.getElementById('fStock').value = p.stock || '';
  document.getElementById('fImageUrl').value = p.image_url || '';
  document.getElementById('fSupplierUrl').value = p.supplier_url || '';
  document.getElementById('fDescription').value = p.description || '';
  document.getElementById('fNotes').value = p.notes || '';
  document.getElementById('fIsNew').checked = p.is_new ?? true;
  document.getElementById('fInStock').checked = p.in_stock ?? true;
  if (p.image_url) {
    document.getElementById('imagePreview').src = p.image_url;
    document.getElementById('imagePreviewWrap').classList.remove('hidden');
  }
  calcCost();
  openModal('编辑商品');
}
window.editProduct = editProduct;

async function deleteProduct(id) {
  if (!confirm('确定删除这个商品？')) return;
  await sb.from('products').delete().eq('id', id);
  loadProducts();
}
window.deleteProduct = deleteProduct;

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.textContent = '保存中…'; btn.disabled = true;

  const costRmb = parseFloat(document.getElementById('fCostRmb').value) || null;
  const shippingRmb = parseFloat(document.getElementById('fShippingRmb').value) || null;
  const costMyr = ((costRmb || 0) + (shippingRmb || 0)) / RMB_TO_MYR;
  const priceMyr = parseFloat(document.getElementById('fPriceMyr').value) || 0;

  const payload = {
    name: document.getElementById('fName').value || document.getElementById('fNameZh').value,
    name_zh: document.getElementById('fNameZh').value,
    category: document.getElementById('fCategory').value,
    sku: document.getElementById('fSku').value || null,
    cost_rmb: costRmb,
    shipping_cost_rmb: shippingRmb,
    cost: costMyr,
    weight_kg: parseFloat(document.getElementById('fWeight').value) || null,
    price_myr: priceMyr || null,
    price: priceMyr,
    stock: parseInt(document.getElementById('fStock').value) || 0,
    image_url: document.getElementById('fImageUrl').value || null,
    supplier_url: document.getElementById('fSupplierUrl').value || null,
    description: document.getElementById('fDescription').value || null,
    notes: document.getElementById('fNotes').value || null,
    is_new: document.getElementById('fIsNew').checked,
    in_stock: document.getElementById('fInStock').checked,
  };

  const editId = document.getElementById('editId').value;
  const { error } = editId
    ? await sb.from('products').update(payload).eq('id', editId)
    : await sb.from('products').insert(payload);

  if (error) alert('保存失败：' + error.message);
  else { closeModal(); loadProducts(); }

  btn.textContent = '保存商品'; btn.disabled = false;
});

init();
</script>
</body>
</html>
